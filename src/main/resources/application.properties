spring.application.name=GymErp

# ================= 서버 설정 =================
server.port=9000

# ================= DB (Oracle 11g) =================
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=yohan
spring.datasource.password=yohan1234

# ================= MyBatis =================
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.example.gymerp
mybatis.configuration.map-underscore-to-camel-case=true

# ================= File Upload =================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# ================= Nginx / HTTPS =================
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# ================= Timezone =================
spring.jackson.time-zone=Asia/Seoul

# ================= Logging =================
logging.level.root=INFO
logging.level.org.mybatis=WARN
logging.level.org.mybatis.spring=WARN
logging.level.org.apache.ibatis=WARN
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.transaction=INFO
